name: Validate Skill System

on:
  pull_request:
    branches:
      - main
    paths:
      - "**/*.md"
      - "skills.json"
      - "SKILL-SYSTEM.md"
      - "design-intelligence.md"
      - "DESIGN.md"
      - "THIRD_PARTY_NOTICES.md"
      - ".github/ISSUE_TEMPLATE/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "catalog/**"
      - "dist/azskills-marketplace/**"
      - "plugins/**"
      - "docs/**"
      - "codex-plugin/**"
      - "godot-3-dev/**"
      - "style-presets/**"
      - "references/style-presets/**"
      - "scientific-figures/**"
      - "references/scientific-figures/**"
      - "integrations/**"
      - "README.md"
      - "assets/**"
      - "resume-evidence-workflow/assets/**"
      - "resume-evidence-workflow/tests/**"
      - ".github/workflows/validate-skills.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-skills:
    name: Validate Skill Registry
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.18

      - name: Install dependencies
        run: npm ci

      - name: Type-check TypeScript sources
        run: npm run typecheck

      - name: Check Godot 3.x guard behavior
        run: |
          node godot-3-dev/scripts/check-godot-3x.ts --self-test

      - name: Validate registry and contracts
        run: |
          node scripts/validate-skills.ts
          node scripts/generate-routing.ts --check

      - name: Validate plugin catalog
        run: node scripts/validate-catalog.ts

      - name: Validate published marketplace
        run: node scripts/check-marketplace.ts

      - name: Test editable resume copy behavior
        run: node resume-evidence-workflow/tests/copy-description.test.ts

      - name: Validate style presets and loader layer
        run: node scripts/check-style-presets.ts

      - name: Validate scientific figure pipeline
        run: node scripts/check-scientific-figures.ts

      - name: Validate integration registry and guides
        run: node scripts/validate-integrations.ts

      - name: Test installer lifecycle
        run: node scripts/test-install-skills.ts

      - name: Test self-contained plugin bundles
        run: |
          node scripts/test-link-bundle.ts
          node scripts/test-package-plugin.ts

      - name: Test standalone hook plugins
        run: |
          node scripts/test-think-tags-hook.ts
          node scripts/test-empty-reply-hook.ts

      - name: Export all plugin archives
        run: |
          node scripts/package-plugin.ts --output "$RUNNER_TEMP/azskills-export"
          for archive in "$RUNNER_TEMP"/azskills-export/zips/*.zip; do
            unzip -tq "$archive"
          done
          expected="$(node -p "require('./catalog/plugins.json').plugins.length")"
          actual="$(find "$RUNNER_TEMP/azskills-export/zips" -maxdepth 1 -name '*.zip' | wc -l)"
          test "$actual" -eq "$expected"
          test -f "$RUNNER_TEMP/azskills-export/azskills-marketplace/.agents/plugins/marketplace.json"
          test -f "$RUNNER_TEMP/azskills-export/azskills-marketplace/plugins/ui-design/.codex-plugin/plugin.json"
          test -f "$RUNNER_TEMP/azskills-export/azskills-marketplace/plugins/empty-reply/hooks/stop-hook.ts"
          mkdir -p "$RUNNER_TEMP/azskills-extracted"
          unzip -q "$RUNNER_TEMP/azskills-export/zips/ui-design.zip" -d "$RUNNER_TEMP/azskills-extracted"
          test -f "$RUNNER_TEMP/azskills-extracted/skills/ui-design/SKILL.md"
          test -f "$RUNNER_TEMP/azskills-extracted/references/modules/ui-design.md"
          test -f "$RUNNER_TEMP/azskills-extracted/ui-design/references/ux/overview.md"

      - name: Test MCP bundle resources
        run: node scripts/test-azskills-mcp.ts

      - name: Check generated integration guides
        run: node scripts/generate-integrations.ts --check
