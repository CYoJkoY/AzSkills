name: Validate Skill System

on:
  pull_request:
    branches:
      - main
    paths:
      - "**/*.md"
      - "skills.json"
      - "SKILL-SYSTEM.md"
      - "design-intelligence.md"
      - "DESIGN.md"
      - "THIRD_PARTY_NOTICES.md"
      - ".github/ISSUE_TEMPLATE/**"
      - "scripts/**"
      - "integrations/**"
      - "README.md"
      - "assets/**"
      - "resume-evidence-workflow/assets/**"
      - "resume-evidence-workflow/tests/**"
      - ".github/workflows/validate-skills.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-skills:
    name: Validate Skill Registry
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check validator syntax
        run: node --check scripts/validate-skills.mjs

      - name: Validate registry and contracts
        run: node scripts/validate-skills.mjs

      - name: Test editable resume copy behavior
        run: node resume-evidence-workflow/tests/copy-description.test.cjs

      - name: Check integration scripts syntax
        run: |
          node --check scripts/install-skills.mjs
          node --check scripts/package-skill.mjs
          node --check scripts/azskills-mcp.mjs
          node --check scripts/generate-integrations.mjs
          node --check scripts/validate-integrations.mjs
          node --check scripts/test-package-skill.mjs
          node --check scripts/test-azskills-mcp.mjs

      - name: Validate integration registry and guides
        run: node scripts/validate-integrations.mjs

      - name: Test installer lifecycle
        run: node scripts/test-install-skills.mjs

      - name: Test portable Skill bundles
        run: node scripts/test-package-skill.mjs

      - name: Export all portable Skill bundles
        run: |
          node scripts/package-skill.mjs --output "$RUNNER_TEMP/azskills-export"
          for archive in "$RUNNER_TEMP"/azskills-export/*.zip; do
            unzip -tq "$archive"
          done
          test "$(find "$RUNNER_TEMP/azskills-export" -maxdepth 1 -name '*.zip' | wc -l)" -eq 24
          mkdir -p "$RUNNER_TEMP/azskills-extracted"
          unzip -q "$RUNNER_TEMP/azskills-export/ui-aesthetics.zip" -d "$RUNNER_TEMP/azskills-extracted"
          test -f "$RUNNER_TEMP/azskills-extracted/SKILL.md"
          test -f "$RUNNER_TEMP/azskills-extracted/_azskills-support/ui-design/references/ux/overview.md"

      - name: Test MCP bundle resources
        run: node scripts/test-azskills-mcp.mjs

      - name: Check generated integration guides
        run: node scripts/generate-integrations.mjs --check
