name: Validate Design Contracts

on:
  pull_request:
    branches:
      - main
    paths:
      - "DESIGN.md"
      - "scripts/check-editorial.mjs"
      - "scripts/check-design-contract.mjs"
      - ".github/badges/**"
      - "assets/**"
      - "frontend-slides/**"
      - "readme-craft/**"
      - "architecture/**"
      - "design-system/**"
      - "design-intelligence.md"
      - "ui-design/**"
      - "skills.json"
      - "README.md"
      - "THIRD_PARTY_NOTICES.md"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/workflows/validate-design-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-design-contract:
    name: Validate Wabi Press Design Contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate canonical contract and implementation
        run: node scripts/check-design-contract.mjs

      - name: Validate terminal rendering and accessible states
        run: node design-system/tui/preview.mjs --check

      - name: Validate contrast and report token parity
        run: node scripts/check-editorial.mjs
