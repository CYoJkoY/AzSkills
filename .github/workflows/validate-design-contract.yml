name: Validate Design Contracts

on:
  pull_request:
    branches:
      - main
    paths:
      - "DESIGN.md"
      - ".github/badges/**"
      - "assets/**"
      - "frontend-slides/**"
      - "l13n/SKILL.md"
      - "design-system/**"
      - "design-intelligence.md"
      - "ui-design/**"
      - "ui-ux-design-intelligence/**"
      - "README.md"
      - "THIRD_PARTY_NOTICES.md"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/workflows/validate-design-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-design-contract:
    name: Validate Workbench Design Contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate canonical contract and implementation
        shell: bash
        run: |
          set -euo pipefail
          test -f DESIGN.md
          grep -q '^name: azskills-workbench$' DESIGN.md
          grep -q '^## Workbench layout$' DESIGN.md
          grep -q '^## Interaction contract$' DESIGN.md
          grep -q '^## Accessibility and responsiveness$' DESIGN.md
          grep -q '^## Visual QA$' DESIGN.md
          grep -q -- '--wb-canvas: #F7F8FA' DESIGN.md
          grep -q -- '--wb-accent: #0B57D0' DESIGN.md
          grep -q -- '--wb-row-height: 26px' DESIGN.md
          grep -q 'VSCodium' DESIGN.md

          test -f design-system/SKILL.md
          test -f design-system/references/design-md-adapter.md
          test -f design-system/references/design-md-schema.md
          test -f design-system/references/source-format-matrix.md
          grep -q '^name: design-system$' design-system/SKILL.md

          test -f design-system/wabi-press.css
          test -f design-system/wabi-press-theme.ts
          test -f design-system/preview/index.html
          grep -q -- '--wb-canvas: #F7F8FA' design-system/wabi-press.css
          grep -q -- '--wb-canvas: #18191C' design-system/wabi-press.css
          grep -q -- '--wb-accent: #0B57D0' design-system/wabi-press.css
          grep -q -- '--wb-row-height: 26px' design-system/wabi-press.css
          grep -q '\.wb-shell' design-system/wabi-press.css
          grep -q '\.wb-sidebar' design-system/wabi-press.css
          grep -q '\.wb-statusbar' design-system/wabi-press.css
          grep -q 'prefers-reduced-motion' design-system/wabi-press.css
          grep -q 'wabi-press.css' design-system/preview/index.html
          grep -q 'skill-search' design-system/preview/index.html
          grep -q 'theme-toggle' design-system/preview/index.html
          grep -q 'data-density' design-system/preview/index.html

          grep -q 'Workbench and information-density contract' ui-design/SKILL.md
          grep -q 'Workbench Usability Checks' ui-ux-design-intelligence/SKILL.md
          grep -q 'VSCodium-inspired workbench model' README.md

      - name: Validate terminal contract and preview
        shell: bash
        run: |
          set -euo pipefail
          test -f design-system/tui/preview.mjs
          grep -q '^## Terminal / TUI contract$' DESIGN.md
          grep -q '^### Cell grid and width classes$' DESIGN.md
          grep -q '^### Terminal colour and attributes$' DESIGN.md
          grep -q 'NO_COLOR' DESIGN.md
          grep -q 'grapheme' DESIGN.md
          grep -q 'design-system/tui/preview.mjs' README.md
          grep -q 'tui/preview.mjs' design-system/SKILL.md
          node design-system/tui/preview.mjs --check
