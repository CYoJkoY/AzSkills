name: Validate Design Contracts

on:
  pull_request:
    branches:
      - main
    paths:
      - "DESIGN.md"
      - ".github/badges/**"
      - "assets/**"
      - "frontend-slides/**"
      - "l13n/SKILL.md"
      - "design-system/**"
      - "design-intelligence.md"
      - "README.md"
      - "THIRD_PARTY_NOTICES.md"
      - ".github/ISSUE_TEMPLATE/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-design-contract:
    name: Validate DESIGN.md Integration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate repository design contract
        shell: bash
        run: |
          set -euo pipefail
          test -f DESIGN.md
          grep -q '^name: azskills-wabi-press$' DESIGN.md
          grep -q '^## Visual thesis$' DESIGN.md
          grep -q '^## Primitive tokens$' DESIGN.md
          grep -q '^## Semantic component rules$' DESIGN.md
          grep -q '^## Visual QA$' DESIGN.md

          # Wabi-Press token contract (light washi + dark inkstone spectra)
          grep -q -- '--bg-canvas: #F5F3EC' DESIGN.md
          grep -q -- '--bg-canvas: #131416' DESIGN.md
          grep -q -- '--accent-cinnabar: #A6382A' DESIGN.md
          grep -q -- '--accent-moss: #3B5848' DESIGN.md
          grep -q -- '--ease-paper: cubic-bezier(0.25, 1, 0.4, 1)' DESIGN.md
          grep -q -- '--ease-ink: cubic-bezier(0.16, 1, 0.3, 1)' DESIGN.md
          grep -q 'data-theme="dark"' DESIGN.md

      - name: Validate design-system Skill
        shell: bash
        run: |
          set -euo pipefail
          test -f design-system/SKILL.md
          test -f design-system/references/design-md-adapter.md
          test -f design-system/references/design-md-schema.md
          test -f design-system/references/source-format-matrix.md

          grep -q '^name: design-system$' design-system/SKILL.md
          grep -q '^description:' design-system/SKILL.md
          grep -q '^## Scope$' design-system/SKILL.md
          grep -q '^## Precedence$' design-system/SKILL.md
          grep -q '^## Normal form$' design-system/SKILL.md
          grep -q '^## Provenance$' design-system/SKILL.md
          grep -q '^## Quality gates$' design-system/SKILL.md
          grep -q '^## Output contract$' design-system/SKILL.md

      - name: Validate Wabi-Press executable artifacts
        shell: bash
        run: |
          set -euo pipefail
          test -f design-system/wabi-press.css
          test -f design-system/wabi-press-theme.ts
          test -f design-system/preview/index.html

          # Tokens: both spectra present in the single CSS authority
          grep -q -- '--bg-canvas: #F5F3EC' design-system/wabi-press.css
          grep -q -- '--bg-canvas: #131416' design-system/wabi-press.css
          grep -q -- '--accent-cinnabar: #A6382A' design-system/wabi-press.css
          grep -q -- '--accent-cinnabar: #C84A3B' design-system/wabi-press.css
          grep -q '\[data-theme="dark"\]' design-system/wabi-press.css
          grep -q -- '--ease-paper: cubic-bezier(0.25, 1, 0.4, 1)' design-system/wabi-press.css
          grep -q -- '--ease-ink: cubic-bezier(0.16, 1, 0.3, 1)' design-system/wabi-press.css
          grep -q 'prefers-reduced-motion' design-system/wabi-press.css

          # Primitive components
          grep -q '\.wabi-card' design-system/wabi-press.css
          grep -q '\.wabi-meta-header' design-system/wabi-press.css
          grep -q '\.editorial-prose' design-system/wabi-press.css
          grep -q '\.wabi-button' design-system/wabi-press.css
          grep -q '\.wabi-input' design-system/wabi-press.css
          grep -q '\.seal-cinnabar' design-system/wabi-press.css

          # Theme controller: native TS, storage + system preference
          grep -q 'localStorage' design-system/wabi-press-theme.ts
          grep -q 'prefers-color-scheme' design-system/wabi-press-theme.ts
          grep -q 'data-theme' design-system/wabi-press-theme.ts

          # Preview mounts the CSS authority
          grep -q 'wabi-press.css' design-system/preview/index.html
          grep -q 'wabi-theme-toggle' design-system/preview/index.html

      - name: Validate AzSkills integration
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'design-system/SKILL.md' README.md
          grep -q 'DESIGN.md adaptation layer' design-intelligence.md
          grep -q 'DESIGN.md integration' THIRD_PARTY_NOTICES.md
          grep -q 'design-system' .github/ISSUE_TEMPLATE/new_skill.yml
          grep -q 'design-system' .github/ISSUE_TEMPLATE/skill_improvement.yml
          grep -q 'design-system' .github/ISSUE_TEMPLATE/bug_report.yml

      - name: Reject stale skill count
        shell: bash
        run: |
          set -euo pipefail
          if grep -Eiq '[0-9]+[[:space:]]+focused Skills' README.md; then
            echo "README contains a hardcoded focused-Skill count."
            exit 1
          fi

      - name: Validate source-format matrix
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'HU-UH awesome-design-md' design-system/references/source-format-matrix.md
          grep -q 'VoltAgent awesome-design-md' design-system/references/source-format-matrix.md
          grep -q 'Google DESIGN.md specification' design-system/references/source-format-matrix.md
