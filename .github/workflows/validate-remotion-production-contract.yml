name: Validate Remotion Production Contract

on:
  pull_request:
    branches:
      - main
    paths:
      - "references/**"
      - "SKILL.md"
      - "remotion-production/**"
      - "README.md"
      - "THIRD_PARTY_NOTICES.md"
      - ".github/workflows/validate-remotion-production-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-remotion-production-contract:
    name: Validate Remotion Production Skill
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Skill contract
        shell: bash
        run: |
          set -euo pipefail

          test -f references/modules/remotion-production.md

          for reference in \
            timeline-composition-patterns.md \
            react-video-architecture.md \
            animation-engine-selection.md \
            asset-pipeline.md \
            render-performance.md \
            audio-video-production.md \
            ai-video-workflow.md \
            production-checklist.md \
            visual-engine-matrix.md
          do
            test -f "remotion-production/references/$reference"
          done

          grep -q '^name: remotion-production$' references/modules/remotion-production.md
          grep -q '^description:' references/modules/remotion-production.md
          grep -q '^## Contract$' references/modules/remotion-production.md
          grep -q '^## Modes$' references/modules/remotion-production.md
          grep -q '^## Workflow$' references/modules/remotion-production.md
          grep -q '^## Determinism rules$' references/modules/remotion-production.md
          grep -q '^## Quality gates$' references/modules/remotion-production.md
          grep -q '^## Output contract$' references/modules/remotion-production.md
          grep -q '^## Failure handling$' references/modules/remotion-production.md
          grep -q '^## References$' references/modules/remotion-production.md

      - name: Validate engine coverage and deterministic timing
        shell: bash
        run: |
          set -euo pipefail

          for engine in \
            "D3.js" \
            "Three.js" \
            "GSAP" \
            "Anime.js" \
            "Popmotion" \
            "Framer Motion" \
            "Rive" \
            "Lottie" \
            "CSS Keyframes" \
            "WAAPI" \
            "Flubber" \
            "Canvas"
          do
            grep -q "$engine" remotion-production/references/animation-engine-selection.md
            grep -q "$engine" remotion-production/references/visual-engine-matrix.md
          done

          grep -q 'Frame number is the only authoritative time input.' references/modules/remotion-production.md
          grep -q 'Randomness is seeded and stable across renders.' references/modules/remotion-production.md
          grep -q 'Any wall-clock or network-dependent path is isolated' references/modules/remotion-production.md

      - name: Validate cross-skill routing
        shell: bash
        run: |
          set -euo pipefail

          for skill in \
            "ui-design" \
            "ui-motion" \
            "frontend-slides" \
            "logo-generator"
          do
            grep -q "$skill" references/modules/remotion-production.md
          done

          grep -q 'remotion-production' README.md
          grep -q 'remotion-production' .github/ISSUE_TEMPLATE/new_skill.yml
          grep -q 'remotion-production' .github/ISSUE_TEMPLATE/skill_improvement.yml
          grep -q 'design-intelligence.md' remotion-production/references/visual-engine-matrix.md
          grep -q 'Remotion Production Contract' .github/workflows/validate-remotion-production-contract.yml

      - name: Reject mechanical upstream-copy markers
        shell: bash
        run: |
          set -euo pipefail

          if grep -RniE \
            'remotion-dev/remotion/blob/.*/packages/skills|packages/skills/skills/remotion/|verbatim.*upstream.*Remotion|copied.*from.*remotion-dev' \
            remotion-production; then
            echo "Remotion production references contain mechanical upstream-copy markers."
            exit 1
          fi
