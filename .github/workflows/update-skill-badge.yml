name: Update Skill Badge

on:
  push:
    branches:
      - main
    paths:
      - "**/SKILL.md"
      - ".github/workflows/update-skill-badge.yml"
      - "assets/azskills-hero.svg"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-skill-badge:
    name: Update Skill Count Badge
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Count skills
        id: count
        shell: bash
        run: |
          set -euo pipefail
          count="$(find . -type f -name 'SKILL.md' -not -path './.git/*' | wc -l)"
          echo "count=${count}" >> "$GITHUB_OUTPUT"
          echo "Detected ${count} skill(s)."

      - name: Synchronize Hero skill count
        env:
          SKILL_COUNT: "${{ steps.count.outputs.count }}"
        shell: python
        run: |
          from pathlib import Path
          import re
          import os

          path = Path("assets/azskills-hero.svg")
          text = path.read_text(encoding="utf-8")
          count = int(os.environ["SKILL_COUNT"])

          pattern = r'(<text id="skill-count"[^>]*>)([^<]+)(</text>)'
          replacement = rf'\g<1>{count} Skills\g<3>'
          updated, changed = re.subn(pattern, replacement, text, count=1)

          if changed != 1:
              raise SystemExit("Hero skill-count marker was not found exactly once.")

          if updated != text:
              path.write_text(updated, encoding="utf-8")
              print(f"Updated Hero skill count to {count}.")
          else:
              print(f"Hero skill count is already {count}.")

      - name: Write badge endpoint
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .github/badges
          cat > .github/badges/skills.json <<EOF
          {
            "schemaVersion": 1,
            "label": "Skills",
            "message": "${{ steps.count.outputs.count }}",
            "color": "8A9E8B"
          }
          EOF

      - name: Commit updated badge and Hero
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .github/badges/skills.json assets/azskills-hero.svg
          if git diff --cached --quiet; then
            echo "Skill badge and Hero are already up to date."
            exit 0
          fi

          git commit -m "chore: sync skill count badge and hero"
          git push
