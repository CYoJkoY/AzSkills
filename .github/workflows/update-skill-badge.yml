name: Update Skill Badge

on:
  push:
    branches:
      - main
    paths:
      - "**/SKILL.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-skill-badge:
    name: Update Skill Count Badge
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Count skills
        id: count
        shell: bash
        run: |
          set -euo pipefail
          count="$(find . -type f -name 'SKILL.md' -not -path './.git/*' | wc -l | tr -d ' ')"
          echo "count=${count}" >> "$GITHUB_OUTPUT"
          echo "Detected ${count} skill(s)."

      - name: Write badge endpoint
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .github/badges
          cat > .github/badges/skills.json <<EOF
          {
            "schemaVersion": 1,
            "label": "Skills",
            "message": "${{ steps.count.outputs.count }}",
            "color": "8A9E8B"
          }
          EOF

      - name: Validate README count hygiene
        shell: bash
        run: |
          set -euo pipefail
          if grep -Eiq '[0-9]+[[:space:]]+skills' README.md; then
            echo "README contains a hardcoded skill count. Use the generated Skills badge instead."
            exit 1
          fi

      - name: Commit updated badge
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .github/badges/skills.json
          if git diff --cached --quiet; then
            echo "Skill badge is already up to date."
            exit 0
          fi

          git commit -m "chore: update skill count badge"
          git push
