<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">AzSkills — reusable AI behavior contracts</title>
  <desc id="desc">A dark editorial system map for AzSkills, connecting a SKILL.md behavior contract through focused reusable skills to a checked task output.</desc>

  <rect width="1400" height="760" rx="34" fill="#0f1719"/>
  <rect x="28" y="28" width="1344" height="704" rx="28" fill="none" stroke="#34484a" stroke-width="2"/>

  <!-- Project-native keyline motif -->
  <g fill="none" stroke="#294043" stroke-width="2" opacity="0.9">
    <path d="M68 112 H250 V126 H320"/>
    <path d="M1080 104 H1330 V118"/>
    <path d="M1160 646 H1330 V632"/>
    <path d="M70 650 H230 V636 H300"/>
  </g>

  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <!-- Header -->
    <g font-family="Cascadia Code, Consolas, monospace" font-size="13" letter-spacing="2.6" fill="#839796">
      <text x="70" y="72">CYoJkoY / AZSKILLS</text>
      <text x="1330" y="72" text-anchor="end">MODULAR · REUSABLE · VERIFIED</text>
    </g>

    <!-- Left / identity -->
    <g transform="translate(70 132)">
      <!-- AzSkills mark -->
      <g transform="translate(0 0)">
        <path d="M0 34 L28 0 H70 L41 34 Z" fill="#9db9b4"/>
        <path d="M53 34 L74 4 L99 34 Z" fill="#d7a85a"/>
      </g>
      <text x="0" y="120" fill="#f2eee5" font-size="70" font-weight="760" letter-spacing="7">AZSKILLS</text>
      <text x="0" y="161" fill="#d7d5cd" font-size="24">Reusable AI behavior contracts.</text>
      <text x="0" y="193" fill="#91a5a3" font-size="16">Explicit rules for real work — inspectable, composable, reusable.</text>

      <!-- Contract specimen -->
      <g transform="translate(0 232)">
        <path d="M0 18 L18 0 H406 L430 24 V170 H0 Z" fill="#152224" stroke="#466063" stroke-width="2"/>
        <path d="M386 0 L430 24 H386 Z" fill="#263638"/>
        <text x="24" y="34" fill="#d7a85a" font-family="Cascadia Code, Consolas, monospace" font-size="12" letter-spacing="2">THE CONTRACT</text>
        <text x="24" y="68" fill="#f1eee7" font-family="Cascadia Code, Consolas, monospace" font-size="24" font-weight="700">SKILL.md</text>
        <line x1="24" y1="84" x2="406" y2="84" stroke="#33494c"/>
        <g font-size="14" fill="#a7b7b4">
          <text x="24" y="111"><tspan fill="#8fb6ad">01</tspan> trigger boundary</text>
          <text x="24" y="134"><tspan fill="#8fb6ad">02</tspan> hard constraints</text>
          <text x="216" y="111"><tspan fill="#d7a85a">03</tspan> workflow</text>
          <text x="216" y="134"><tspan fill="#84a9bb">04</tspan> quality gates</text>
          <text x="24" y="157"><tspan fill="#d7a85a">05</tspan> output contract</text>
        </g>
      </g>
    </g>

    <!-- Middle / skills -->
    <g transform="translate(570 126)">
      <text x="0" y="0" fill="#d7a85a" font-family="Cascadia Code, Consolas, monospace" font-size="12" letter-spacing="2.4">FOCUSED SKILLS</text>
      <text x="0" y="30" fill="#94a7a5" font-size="15">One responsibility at a time.</text>

      <!-- spine -->
      <path d="M15 84 V526" fill="none" stroke="#385254" stroke-width="2"/>
      <circle cx="15" cy="84" r="5" fill="#d7a85a"/>
      <circle cx="15" cy="526" r="5" fill="#8fb6ad"/>

      <g transform="translate(0 60)">
        <circle cx="15" cy="24" r="10" fill="#8fb6ad" stroke="#102022" stroke-width="4"/>
        <rect x="42" y="0" width="418" height="62" rx="16" fill="#172527" stroke="#385254"/>
        <text x="66" y="28" fill="#e6e8e2" font-family="Cascadia Code, Consolas, monospace" font-size="15" font-weight="700">application-architecture</text>
        <text x="66" y="47" fill="#859a98" font-size="12">runtime · process · persistence</text>
      </g>
      <g transform="translate(0 136)">
        <circle cx="15" cy="24" r="10" fill="#84a9bb" stroke="#102022" stroke-width="4"/>
        <rect x="42" y="0" width="418" height="62" rx="16" fill="#172527" stroke="#385254"/>
        <text x="66" y="28" fill="#e6e8e2" font-family="Cascadia Code, Consolas, monospace" font-size="15" font-weight="700">frontend-architecture</text>
        <text x="66" y="47" fill="#859a98" font-size="12">language · framework · boundaries</text>
      </g>
      <g transform="translate(0 212)">
        <circle cx="15" cy="24" r="10" fill="#d7a85a" stroke="#102022" stroke-width="4"/>
        <rect x="42" y="0" width="418" height="62" rx="16" fill="#172527" stroke="#385254"/>
        <text x="66" y="28" fill="#e6e8e2" font-family="Cascadia Code, Consolas, monospace" font-size="15" font-weight="700">ui-design</text>
        <text x="66" y="47" fill="#859a98" font-size="12">visual · interaction · accessibility</text>
      </g>
      <g transform="translate(0 288)">
        <circle cx="15" cy="24" r="10" fill="#8aa9b5" stroke="#102022" stroke-width="4"/>
        <rect x="42" y="0" width="418" height="62" rx="16" fill="#172527" stroke="#385254"/>
        <text x="66" y="28" fill="#e6e8e2" font-family="Cascadia Code, Consolas, monospace" font-size="15" font-weight="700">readme-craft</text>
        <text x="66" y="47" fill="#859a98" font-size="12">documentation · links · visual QA</text>
      </g>
      <g transform="translate(0 364)">
        <circle cx="15" cy="24" r="10" fill="#8fb6ad" stroke="#102022" stroke-width="4"/>
        <rect x="42" y="0" width="418" height="62" rx="16" fill="#172527" stroke="#385254"/>
        <text x="66" y="28" fill="#e6e8e2" font-family="Cascadia Code, Consolas, monospace" font-size="15" font-weight="700">l13n / any2zh / zh2en</text>
        <text x="66" y="47" fill="#859a98" font-size="12">localization · translation</text>
      </g>
    </g>

    <!-- Connective beam -->
    <g fill="none" stroke="#6b8785" stroke-width="2">
      <path d="M1000 210 C1008 210 1012 210 1020 210"/>
      <path d="M1000 286 C1008 286 1012 248 1020 248"/>
      <path d="M1000 362 C1008 362 1012 286 1020 286"/>
      <path d="M1000 438 C1008 438 1012 324 1020 324"/>
      <path d="M1000 514 C1008 514 1012 362 1020 362"/>
    </g>
    <g fill="#8fb6ad">
      <circle cx="1000" cy="210" r="4"/>
      <circle cx="1000" cy="286" r="4"/>
      <circle cx="1000" cy="362" r="4"/>
      <circle cx="1000" cy="438" r="4"/>
      <circle cx="1000" cy="514" r="4"/>
    </g>

    <!-- Right / result -->
    <g transform="translate(1020 154)">
      <path d="M20 0 H288 L310 22 V336 H0 V22 Z" fill="#142123" stroke="#6d9894" stroke-width="2"/>
      <path d="M288 0 V22 H310" fill="none" stroke="#6d9894" stroke-width="2"/>

      <text x="28" y="40" fill="#8ea5a2" font-family="Cascadia Code, Consolas, monospace" font-size="12" letter-spacing="2">TASK → OUTPUT</text>
      <circle cx="273" cy="34" r="7" fill="#d7a85a"/>

      <g transform="translate(88 82)">
        <circle cx="67" cy="67" r="56" fill="#1d3032" stroke="#87aaa5" stroke-width="2"/>
        <path d="M40 68 L59 87 L98 43" fill="none" stroke="#d7a85a" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="67" cy="67" r="68" fill="none" stroke="#314a4c" stroke-width="1"/>
      </g>

      <text x="155" y="236" text-anchor="middle" fill="#f2eee6" font-size="28" font-weight="750">Better results</text>
      <text x="155" y="268" text-anchor="middle" fill="#c7ccc6" font-size="18">through explicit constraints.</text>
      <line x1="35" y1="292" x2="275" y2="292" stroke="#32474a"/>
      <text x="155" y="319" text-anchor="middle" fill="#91b5ad" font-family="Cascadia Code, Consolas, monospace" font-size="12" letter-spacing="1.8">CHECKED OUTPUT</text>
    </g>

    <!-- Bottom statement -->
    <line x1="70" y1="660" x2="1330" y2="660" stroke="#304446"/>
    <g transform="translate(70 694)">
      <text x="0" y="0" fill="#d7a85a" font-family="Cascadia Code, Consolas, monospace" font-size="12" letter-spacing="2.2">SMALL SKILLS · EXPLICIT CONSTRAINTS · BETTER WORK</text>
    </g>
    <text x="1330" y="694" text-anchor="end" fill="#718785" font-size="13">Inspectable · composable · versioned</text>
  </g>
</svg>
