<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">AzSkills — reusable AI skills with explicit behavior contracts</title>
  <desc id="desc">A dark three-column modular diagram showing AzSkills, reusable SKILL.md definitions, and a checked task output without overlapping elements.</desc>

  <rect width="1200" height="650" rx="32" fill="#11171A"/>
  <rect x="28" y="28" width="1144" height="594" rx="26" fill="#162024" stroke="#33484A" stroke-width="2"/>

  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <g fill="#8FA9A8" font-family="Cascadia Code, Consolas, monospace" font-size="13" letter-spacing="3">
      <text x="62" y="68">CYoJkoY / AZSKILLS</text>
      <text x="1138" y="68" text-anchor="end">MODULAR / REUSABLE / OPEN SOURCE</text>
    </g>

    <!-- Left column: identity -->
    <g transform="translate(64 104)">
      <path d="M0 30 L24 0 H54 L31 30 Z" fill="#9BBAB5"/>
      <path d="M42 30 L58 8 L76 30 Z" fill="#D7A85A"/>
      <text x="0" y="122" fill="#F0EBE2" font-size="56" font-weight="750" letter-spacing="7">AZSKILLS</text>
      <text x="0" y="160" fill="#D9D5CC" font-size="21">Reusable AI skills with explicit</text>
      <text x="0" y="190" fill="#D9D5CC" font-size="21">behavior contracts.</text>
      <rect x="0" y="218" width="94" height="6" rx="3" fill="#D7A85A"/>

      <g transform="translate(0 254)" font-family="Cascadia Code, Consolas, monospace">
        <rect x="0" y="0" width="112" height="38" rx="10" fill="#1D2B2E" stroke="#385055"/>
        <text x="56" y="25" text-anchor="middle" fill="#B4C8C7" font-size="13">Skill catalog</text>
        <rect x="124" y="0" width="112" height="38" rx="10" fill="#1D2B2E" stroke="#385055"/>
        <text x="180" y="25" text-anchor="middle" fill="#B4C8C7" font-size="13">Modular</text>
        <rect x="0" y="50" width="146" height="38" rx="10" fill="#1D2B2E" stroke="#385055"/>
        <text x="73" y="75" text-anchor="middle" fill="#B4C8C7" font-size="13">GitHub-native</text>
      </g>
    </g>

    <!-- Center column: reusable skills -->
    <g transform="translate(438 104)">
      <text x="0" y="0" fill="#D7A85A" font-family="Cascadia Code, Consolas, monospace" font-size="12" letter-spacing="2">SKILL CATALOG</text>
      <text x="0" y="24" fill="#9DAEAC" font-size="14">Reusable behavior modules</text>

      <g transform="translate(0 42)">
        <rect x="0" y="0" width="332" height="52" rx="14" fill="#1C2B2E" stroke="#3B5558"/>
        <circle cx="26" cy="26" r="8" fill="#8FB7AC"/>
        <text x="48" y="23" fill="#C5D6D4" font-family="Cascadia Code, Consolas, monospace" font-size="13" font-weight="700">SKILL.md</text>
        <text x="48" y="42" fill="#92A7A6" font-size="12">engineering</text>
      </g>
      <g transform="translate(0 104)">
        <rect x="0" y="0" width="332" height="52" rx="14" fill="#1C2B2E" stroke="#3B5558"/>
        <circle cx="26" cy="26" r="8" fill="#7EA3B8"/>
        <text x="48" y="23" fill="#C5D6D4" font-family="Cascadia Code, Consolas, monospace" font-size="13" font-weight="700">SKILL.md</text>
        <text x="48" y="42" fill="#92A7A6" font-size="12">visual design</text>
      </g>
      <g transform="translate(0 166)">
        <rect x="0" y="0" width="332" height="52" rx="14" fill="#1C2B2E" stroke="#3B5558"/>
        <circle cx="26" cy="26" r="8" fill="#D7A85A"/>
        <text x="48" y="23" fill="#C5D6D4" font-family="Cascadia Code, Consolas, monospace" font-size="13" font-weight="700">SKILL.md</text>
        <text x="48" y="42" fill="#92A7A6" font-size="12">documentation</text>
      </g>
      <g transform="translate(0 228)">
        <rect x="0" y="0" width="332" height="52" rx="14" fill="#1C2B2E" stroke="#3B5558"/>
        <circle cx="26" cy="26" r="8" fill="#8FB7AC"/>
        <text x="48" y="23" fill="#C5D6D4" font-family="Cascadia Code, Consolas, monospace" font-size="13" font-weight="700">SKILL.md</text>
        <text x="48" y="42" fill="#92A7A6" font-size="12">translation</text>
      </g>
      <g transform="translate(0 290)">
        <rect x="0" y="0" width="332" height="52" rx="14" fill="#1C2B2E" stroke="#3B5558"/>
        <circle cx="26" cy="26" r="8" fill="#86A9B7"/>
        <text x="48" y="23" fill="#C5D6D4" font-family="Cascadia Code, Consolas, monospace" font-size="13" font-weight="700">SKILL.md</text>
        <text x="48" y="42" fill="#92A7A6" font-size="12">localization</text>
      </g>
      <g transform="translate(0 352)">
        <rect x="0" y="0" width="332" height="52" rx="14" fill="#1C2B2E" stroke="#3B5558"/>
        <circle cx="26" cy="26" r="8" fill="#D7A85A"/>
        <text x="48" y="23" fill="#C5D6D4" font-family="Cascadia Code, Consolas, monospace" font-size="13" font-weight="700">SKILL.md</text>
        <text x="48" y="42" fill="#92A7A6" font-size="12">publishing</text>
      </g>
    </g>

    <!-- Connectors: center column to task -->
    <g fill="none" stroke="#708D8D" stroke-width="2" opacity="0.85">
      <path d="M770 172 C790 172 798 184 818 184"/>
      <path d="M770 234 C790 234 798 222 818 222"/>
      <path d="M770 296 C792 296 800 260 818 260"/>
      <path d="M770 358 C792 358 800 298 818 298"/>
      <path d="M770 420 C792 420 800 336 818 336"/>
      <path d="M770 482 C792 482 800 374 818 374"/>
    </g>

    <!-- Right column: task/output -->
    <g transform="translate(818 144)">
      <rect x="0" y="0" width="304" height="282" rx="22" fill="#142024" stroke="#6E9997" stroke-width="2"/>
      <text x="24" y="32" fill="#9CB4B2" font-family="Cascadia Code, Consolas, monospace" font-size="12" letter-spacing="2">TASK</text>
      <circle cx="270" cy="26" r="7" fill="#D7A85A"/>
      <path d="M152 60 v34 M138 80 l14 14 l14-14" stroke="#D7A85A" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="152" y="136" text-anchor="middle" fill="#F0EBE2" font-size="24" font-weight="700">Better results</text>
      <text x="152" y="168" text-anchor="middle" fill="#D2D0C8" font-size="18">through composition.</text>
      <line x1="58" y1="194" x2="246" y2="194" stroke="#33484A"/>
      <circle cx="152" cy="222" r="16" fill="#8FB7AC"/>
      <path d="M144 222 l6 6 l12-13" stroke="#102020" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="152" y="255" text-anchor="middle" fill="#8FB7AC" font-family="Cascadia Code, Consolas, monospace" font-size="12" letter-spacing="2">CHECKED OUTPUT</text>
    </g>

    <!-- Bottom principles -->
    <line x1="64" y1="500" x2="1136" y2="500" stroke="#33484A"/>

    <g transform="translate(64 532)">
      <text x="0" y="0" fill="#D7A85A" font-family="Cascadia Code, Consolas, monospace" font-size="12" letter-spacing="2">BEHAVIOR CONTRACTS</text>
      <text x="0" y="22" fill="#9DAEAC" font-size="13">Triggers · rules · workflow · QA · output</text>
    </g>
    <g transform="translate(330 532)">
      <text x="0" y="0" fill="#D7A85A" font-family="Cascadia Code, Consolas, monospace" font-size="12" letter-spacing="2">SHARED DESIGN INTELLIGENCE</text>
      <text x="0" y="22" fill="#9DAEAC" font-size="13">A common visual reasoning layer</text>
    </g>
    <g transform="translate(688 532)">
      <text x="0" y="0" fill="#D7A85A" font-family="Cascadia Code, Consolas, monospace" font-size="12" letter-spacing="2">SMALL SKILLS / BIG COMBINATIONS</text>
      <text x="0" y="22" fill="#9DAEAC" font-size="13">Compose only what the task needs</text>
    </g>
    <g transform="translate(990 532)">
      <text x="0" y="0" fill="#D7A85A" font-family="Cascadia Code, Consolas, monospace" font-size="12" letter-spacing="2">OPEN SOURCE</text>
      <text x="0" y="22" fill="#9DAEAC" font-size="13">Inspectable · editable · versioned</text>
    </g>
  </g>
</svg>
