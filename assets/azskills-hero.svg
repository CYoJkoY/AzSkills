<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 560" role="img" aria-labelledby="title desc">
  <title id="title">AzSkills</title>
  <desc id="desc">AzSkills is a modular collection of reusable AI skills for development, translation, localization, and documentation.</desc>

  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8A9E8B" stop-opacity="0.18"/>
      <stop offset="72%" stop-color="#8A9E8B" stop-opacity="0.035"/>
      <stop offset="100%" stop-color="#8A9E8B" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="560" rx="36" fill="#1E1E1E"/>
  <rect x="34" y="34" width="1532" height="492" rx="30" fill="#2A2A2A" stroke="#5A6B6B" stroke-width="2"/>

  <g fill="#8A9E8B">
    <circle cx="118" cy="122" r="4" opacity="0.60"/>
    <circle cx="150" cy="154" r="2" opacity="0.32"/>
    <circle cx="1482" cy="122" r="4" opacity="0.60"/>
    <circle cx="1450" cy="154" r="2" opacity="0.32"/>
    <circle cx="118" cy="438" r="3" opacity="0.42"/>
    <circle cx="1482" cy="438" r="3" opacity="0.42"/>
  </g>

  <g stroke="#5A6B6B" stroke-width="1.5" opacity="0.24">
    <line x1="118" y1="122" x2="150" y2="154"/>
    <line x1="1482" y1="122" x2="1450" y2="154"/>
    <line x1="118" y1="438" x2="150" y2="406"/>
    <line x1="1482" y1="438" x2="1450" y2="406"/>
  </g>

  <circle cx="800" cy="210" r="162" fill="url(#glow)"/>

  <g transform="translate(800 210)">
    <!-- Clean modular core -->
    <circle r="112" fill="#202525" stroke="#8A9E8B" stroke-width="3"/>
    <circle r="94" fill="none" stroke="#7A8E8E" stroke-width="2" stroke-dasharray="4 11" opacity="0.78"/>

    <g fill="#8A9E8B">
      <circle cx="0" cy="-112" r="7"/>
      <circle cx="97" cy="-56" r="7"/>
      <circle cx="97" cy="56" r="7"/>
      <circle cx="0" cy="112" r="7"/>
      <circle cx="-97" cy="56" r="7"/>
      <circle cx="-97" cy="-56" r="7"/>
    </g>

    <polygon points="0,-55 48,-27 48,27 0,55 -48,27 -48,-27" fill="#1E1E1E" stroke="#E6DED6" stroke-width="4"/>
    <path d="M-24 4 L-8 20 L28 -17" fill="none" stroke="#8A9E8B" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g font-family="Inter, Segoe UI, Arial, sans-serif" text-anchor="middle">
    <text x="800" y="356" font-size="58" font-weight="700" letter-spacing="9" fill="#E6DED6">AZSKILLS</text>
    <text x="800" y="396" font-size="19" font-weight="600" letter-spacing="3.5" fill="#8A9E8B">MODULAR AI SKILLS</text>
    <text x="800" y="430" font-size="16" fill="#BEB8AE">Development · Translation · Localization · Documentation</text>
  </g>

  <path d="M590 478 H1010" stroke="#5A6B6B" stroke-width="2" stroke-dasharray="4 10" opacity="0.75"/>
</svg>
